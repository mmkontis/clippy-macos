name: Build and test macOS
on: [push, pull_request]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare verified ChatGPT component
        run: python3 scripts/fetch-codex.py
      - name: Test clipboard privacy and text AI
        run: bash scripts/test.sh
      - name: Build Apple Silicon and Intel
        run: >-
          xcodebuild -project Clippy.xcodeproj -scheme Clippy
          -configuration Release -derivedDataPath build
          -destination 'generic/platform=macOS'
          'ARCHS=arm64 x86_64' ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
      - name: Build the sandboxed Store edition
        run: >-
          xcodebuild -project Clippy.xcodeproj -scheme ClippyStore
          -configuration Release -derivedDataPath build-store
          -destination 'generic/platform=macOS'
          'ARCHS=arm64 x86_64' ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
      - name: Verify Store updater exclusion
        run: test ! -d build-store/Build/Products/Release/Clippy.app/Contents/Frameworks/Sparkle.framework
      - name: Verify bundled ChatGPT architectures
        run: |
          lipo build/Build/Products/Release/Clippy.app/Contents/Helpers/codex -verify_arch arm64 x86_64
          lipo build-store/Build/Products/Release/Clippy.app/Contents/Helpers/codex -verify_arch arm64 x86_64
